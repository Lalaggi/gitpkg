[package]
name = "gitpkg"
version = "0.1.0"
edition = "2024"

[dependencies]
md5 = "0.7"
chrono = "0.4"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"  # For find_data_files
shell-words = "1"  # For splitting user-supplied build flags
clap = { version = "4", features = ["derive"] }
